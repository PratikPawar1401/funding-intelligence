version: '3.8'

services:
  # The main application containing the API and CLI tools
  issr-app:
    build: .
    container_name: issr-funding-intel
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./src:/app/src
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=true
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ENABLE_LAYER3_LLM=false  # Set to true if running Ollama locally
      - SQLITE_DB_PATH=data/queues/nsf_queue.db
      - APP_DB_PATH=data/db/funding_intelligence.db
    command: uvicorn foa_pipeline.api.app:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Ollama service for Layer 3 tagging if you want it dockerized instead of host-installed
  # ollama:
  #   image: ollama/ollama
  #   container_name: issr-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  ollama_data:
